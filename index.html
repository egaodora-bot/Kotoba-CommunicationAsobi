<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kotoba-CommunicationAsobi</title>
<style>
:root {
  font-family: system-ui, sans-serif;
  color: #243247;
  background: #f3f6fa;
}
* { box-sizing: border-box; }
body { margin: 0; }
header {
  background: #173b68;
  color: white;
  padding: 22px;
  text-align: center;
}
header h1 { font-size: 24px; margin: 0 0 8px; }
header p { margin: 0; font-size: 14px; }
main { max-width: 940px; margin: auto; padding: 20px; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 12px;
  margin-bottom: 18px;
  box-shadow: 0 2px 8px #0000000c;
}
h2 { font-size: 19px; margin-top: 0; }
input, select, button {
  font: inherit;
  padding: 11px;
  border-radius: 7px;
}
input, select {
  border: 1px solid #bbc7d5;
  max-width: 100%;
}
#word { width: 100%; margin-bottom: 12px; }
.languages {
  display: flex;
  flex-wrap: wrap;
  gap: 12px;
  margin: 12px 0 18px;
}
.languages label { font-size: 14px; }
.languages input { max-width: none; }
button {
  cursor: pointer;
  border: 0;
  background: #1769aa;
  color: white;
}
button.secondary { background: #e8eef5; color: #243247; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.result {
  border: 1px solid #dce3ec;
  border-radius: 9px;
  padding: 15px;
  margin: 12px 0;
}
.result h3 { margin: 0 0 10px; }
.foreign { font-size: 25px; font-weight: 700; }
.muted { color: #637187; font-size: 13px; }
.history-item {
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: 10px;
  padding: 10px 0;
  border-bottom: 1px solid #e4e9ef;
}

/* 画面上では印刷用カードを表示しない */
#printArea { display: none; }

/* 名刺サイズ：91mm × 55mm */
.card {
  width: 91mm;
  height: 55mm;
  box-sizing: border-box;
  padding: 5mm;
  border: 1px solid #ccd4df;
  border-radius: 3mm;
  background: white;
  color: #18283c;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: center;
  break-inside: avoid;
  page-break-inside: avoid;
}
.card .foreign { font-size: 20pt; line-height: 1.2; }
.card .jp { font-size: 10pt; margin-top: 3mm; }
.card .reading { font-size: 10pt; margin-top: 2mm; }
.card .meaning { font-size: 9pt; margin-top: 2mm; }
footer { text-align: center; padding: 18px; color: #637187; }

@media print {
  /* 用紙はA4。カード自体は名刺サイズのまま */
  @page {
    size: A4 portrait;
    margin: 3mm;
  }

  html, body {
    width: auto !important;
    height: auto !important;
    margin: 0 !important;
    padding: 0 !important;
    background: white !important;
  }

  body > header,
  body > footer,
  main > section {
    display: none !important;
  }

  main {
    display: block !important;
    width: auto !important;
    max-width: none !important;
    margin: 0 !important;
    padding: 0 !important;
  }

  #printArea {
    display: grid !important;
    position: static !important;
    width: 100% !important;
    margin: 0 !important;
    padding: 0 !important;
    grid-template-columns: repeat(2, 91mm);
    grid-auto-rows: 55mm;
    column-gap: 2mm;
    row-gap: 2mm;
    align-content: start;
    justify-content: start;
  }

  #printArea .card {
    display: flex !important;
    width: 91mm !important;
    height: 55mm !important;
    margin: 0 !important;
    border: 1px solid #ccd4df;
    border-radius: 3mm;
    break-inside: avoid !important;
    page-break-inside: avoid !important;
    break-after: auto !important;
    page-break-after: auto !important;
    -webkit-print-color-adjust: exact;
    print-color-adjust: exact;
  }
}
</style>
</head>
<body>
<header>
  <h1>Kotoba-CommunicationAsobi</h1>
  <p>日本語から世界の言葉へ — 多言語検索・会話カード</p>
</header>

<main>
  <section class="panel">
    <h2>🔎 言葉を検索</h2>
    <label for="word">日本語の言葉・表現</label>
    <input id="word" placeholder="例：こんにちは、ありがとう、すみません">
    <div class="muted">検索サンプル：こんにちは／ありがとう／すみません／おはよう／さようなら</div>

    <h3>表示する言語</h3>
    <div class="languages">
      <label><input type="checkbox" value="en" checked> 英語</label>
      <label><input type="checkbox" value="zh" checked> 中国語</label>
      <label><input type="checkbox" value="ko" checked> 韓国語</label>
      <label><input type="checkbox" value="fr"> フランス語</label>
      <label><input type="checkbox" value="es"> スペイン語</label>
    </div>
    <button type="button" onclick="searchWord()">検索する</button>
  </section>

  <section class="panel">
    <h2>📖 検索結果</h2>
    <div id="results">日本語を入力して検索してください。</div>
    <div class="actions">
      <button type="button" onclick="printCards()">カードを印刷</button>
      <button type="button" class="secondary" onclick="saveResults()">結果を保存</button>
    </div>
  </section>

  <section class="panel">
    <h2>🕘 検索履歴</h2>
    <div id="history"></div>
    <button type="button" class="secondary" onclick="clearHistory()">履歴を削除</button>
  </section>

  <div id="printArea"></div>
</main>
<footer>多言語データベース — 試作版</footer>

<script>
const dictionary = {
  "こんにちは": {
    en: ["Hello", "ハロー", "こんにちは"],
    zh: ["你好", "Nǐ hǎo", "こんにちは"],
    ko: ["안녕하세요", "アンニョンハセヨ", "こんにちは"],
    fr: ["Bonjour", "ボンジュール", "こんにちは"],
    es: ["Hola", "オラ", "こんにちは"]
  },
  "ありがとう": {
    en: ["Thank you", "サンキュー", "ありがとう"],
    zh: ["谢谢", "Xièxie", "ありがとう"],
    ko: ["감사합니다", "カムサハムニダ", "ありがとうございます"],
    fr: ["Merci", "メルシー", "ありがとう"],
    es: ["Gracias", "グラシアス", "ありがとう"]
  },
  "すみません": {
    en: ["Excuse me", "エクスキューズ ミー", "すみません"],
    zh: ["不好意思", "Bù hǎoyìsi", "すみません"],
    ko: ["실례합니다", "シルレハムニダ", "失礼します"],
    fr: ["Excusez-moi", "エクスキュゼ モワ", "すみません"],
    es: ["Disculpe", "ディスクルペ", "すみません"]
  },
  "おはよう": {
    en: ["Good morning", "グッド モーニング", "おはようございます"],
    zh: ["早上好", "Zǎoshang hǎo", "おはようございます"],
    ko: ["좋은 아침이에요", "チョウン アチミエヨ", "おはようございます"],
    fr: ["Bonjour", "ボンジュール", "おはようございます"],
    es: ["Buenos días", "ブエノス ディアス", "おはようございます"]
  },
  "さようなら": {
    en: ["Goodbye", "グッドバイ", "さようなら"],
    zh: ["再见", "Zàijiàn", "さようなら"],
    ko: ["안녕히 가세요", "アンニョンヒ カセヨ", "さようなら"],
    fr: ["Au revoir", "オ ルヴォワール", "さようなら"],
    es: ["Adiós", "アディオス", "さようなら"]
  }
};

const languageNames = {
  en: "英語",
  zh: "中国語（簡体字）",
  ko: "韓国語",
  fr: "フランス語",
  es: "スペイン語"
};

let currentResults = [];

function escapeHTML(value) {
  return String(value).replace(/[&<>"']/g, char => ({
    "&": "&amp;",
    "<": "&lt;",
    ">": "&gt;",
    '"': "&quot;",
    "'": "&#39;"
  })[char]);
}

function searchWord(value) {
  const word = (typeof value === "string"
    ? value
    : document.getElementById("word").value).trim();

  if (!word) {
    alert("日本語を入力してください。");
    return;
  }

  document.getElementById("word").value = word;

  const entries = dictionary[word];
  const selected = [...document.querySelectorAll(".languages input:checked")]
    .map(el => el.value);

  if (!selected.length) {
    alert("表示する言語を選んでください。");
    return;
  }

  if (!entries) {
    currentResults = [];
    document.getElementById("results").textContent =
      "この言葉はサンプル辞書にありません。現在は登録済みの言葉のみ検索できます。";
    document.getElementById("printArea").innerHTML = "";
    return;
  }

  currentResults = selected.filter(lang => entries[lang]).map(lang => ({
    word,
    lang,
    language: languageNames[lang],
    text: entries[lang][0],
    reading: entries[lang][1],
    meaning: entries[lang][2]
  }));

  document.getElementById("results").innerHTML = currentResults.map((item, i) => `
    <article class="result">
      <h3>${escapeHTML(item.language)}</h3>
      <div class="foreign">${escapeHTML(item.text)}</div>
      <p>読み方：${escapeHTML(item.reading)}</p>
      <p>意味：${escapeHTML(item.meaning)}</p>
      <button type="button" class="secondary" onclick="printOne(${i})">
        この言葉を印刷
      </button>
    </article>
  `).join("");

  document.getElementById("printArea").innerHTML =
    currentResults.map(makeCard).join("");

  addHistory(word);
}

function makeCard(item) {
  return `<div class="card">
    <div class="muted">${escapeHTML(item.language)}</div>
    <div class="foreign">${escapeHTML(item.text)}</div>
    <div class="reading">読み方：${escapeHTML(item.reading)}</div>
    <div class="meaning">意味：${escapeHTML(item.meaning)}</div>
    <div class="jp">日本語：${escapeHTML(item.word)}</div>
  </div>`;
}

function printCards() {
  if (!currentResults.length) {
    alert("先に言葉を検索してください。");
    return;
  }
  document.getElementById("printArea").innerHTML =
    currentResults.map(makeCard).join("");
  window.print();
}

function printOne(index) {
  const item = currentResults[index];
  if (!item) return;
  document.getElementById("printArea").innerHTML = makeCard(item);
  window.print();
}

function addHistory(word) {
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem("kotobaHistory") || "[]");
    if (!Array.isArray(history)) history = [];
  } catch (_) {
    history = [];
  }

  history = history.filter(item => item.word !== word);
  history.unshift({ word, date: new Date().toLocaleString("ja-JP") });

  try {
    localStorage.setItem("kotobaHistory", JSON.stringify(history.slice(0, 50)));
  } catch (_) {}
  showHistory();
}

function showHistory() {
  let history = [];
  try {
    history = JSON.parse(localStorage.getItem("kotobaHistory") || "[]");
    if (!Array.isArray(history)) history = [];
  } catch (_) {
    history = [];
  }

  document.getElementById("history").innerHTML = history.length
    ? history.map(item => `
      <div class="history-item">
        <span>${escapeHTML(item.word)}<br><small>${escapeHTML(item.date)}</small></span>
        <button type="button" class="secondary"
          onclick="searchWord(${JSON.stringify(item.word)})">再検索</button>
      </div>
    `).join("")
    : '<p class="muted">履歴はまだありません。</p>';
}

function saveResults() {
  if (!currentResults.length) {
    alert("保存する検索結果がありません。");
    return;
  }

  let saved = [];
  try {
    saved = JSON.parse(localStorage.getItem("kotobaSaved") || "[]");
    if (!Array.isArray(saved)) saved = [];
  } catch (_) {
    saved = [];
  }

  currentResults.forEach(item => {
    if (!saved.some(s => s.word === item.word && s.lang === item.lang)) {
      saved.push(item);
    }
  });

  try {
    localStorage.setItem("kotobaSaved", JSON.stringify(saved));
    alert("検索結果をお気に入りデータとして保存しました。");
  } catch (_) {
    alert("保存できませんでした。ブラウザーの保存設定を確認してください。");
  }
}

function clearHistory() {
  if (confirm("検索履歴を削除しますか？")) {
    localStorage.removeItem("kotobaHistory");
    showHistory();
  }
}

document.getElementById("word").addEventListener("keydown", event => {
  if (event.key === "Enter") searchWord();
});

window.addEventListener("afterprint", () => {
  // 印刷後も現在の検索結果をそのまま保持します。
});

showHistory();
</script>
</body>
</html>
